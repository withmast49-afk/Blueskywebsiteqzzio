<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bluesky Hub</title>
    <link rel="stylesheet" href="style/style.css?v=999">
</head>

<body>

    <div class="bg-banner"></div>

    <div class="container">
        <div class="profile-card">

            <img
                src="assest/banner.jpg"
                alt="BlueSky Logo"
                class="logo-img"
            >

            <p class="bio">
                Welcome to my official workspace
            </p>

            <div class="links-container">

                <a
                    href="https://www.tiktok.com/@3dpil?_r=1&_t=ZS-98tbLUpCAba"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="btn-link"
                >
                    <img
                        src="assest/tiktok.png"
                        alt="TikTok"
                        class="link-icon"
                    >
                    <span>TikTok</span>
                </a>

                <a
                    href="https://s.castle.xyz/_7FdWImr8HpF"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="btn-link"
                >
                    <img
                        src="assest/castle.png"
                        alt="Castle"
                        class="link-icon"
                    >
                    <span>Castle</span>
                </a>

                <a
                    href="https://www.roblox.com/users/5315204435/profile"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="btn-link"
                >
                    <img
                        src="assest/roblox.png"
                        alt="Roblox"
                        class="link-icon"
                    >
                    <span>Roblox</span>
                </a>

                <a
                    href="https://discord.gg/Rw4pCRGDvY"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="btn-link"
                >
                    <img
                        src="assest/discord.png"
                        alt="Discord"
                        class="link-icon"
                    >
                    <span>Discord</span>
                </a>

            </div>

            <footer>
                <p>&copy; 2026 blueskywebsite.qzz.io</p>
            </footer>

        </div>
    </div>

    <script src="js/script.js"></script>

</body>
</html>
